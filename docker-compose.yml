version: '3.8'

services:
  # Servicio de Blockchain existente
  blockchain-service:
    image: limpiaturincon-blockchain
    container_name: blockchain-service
    ports:
      - "3001:3001"
  # le indicamos la ruta exacta de las variables del servicio blockchain sepolia ethereum ...
    env_file:
      - ./blockchain/.env.blockchain
    restart: unless-stopped
    # Desactivamos el healthcheck para evitar el estado "unhealthy" por el 401 Unauthorized
    healthcheck:
      disable: true

  # Servicio de Mailpit para captura de correos
  mailpit:
    image: axllent/mailpit
    container_name: limpiaturincon-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # Puerto SMTP para enviar correos desde Laravel
      - "8025:8025" # Dashboard web para ver los correos capturados
